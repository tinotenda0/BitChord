# Fork: builds BitChord and publishes it to the family releases page
# (https://api.tinotenda.co/api/v1/releases/page?app=bitchord), the way
# PixelPlayer's publish workflow does.
#
#   dev  -> "BitChord Dev" (com.dev.bitchord), installs beside the stable app
#   prod -> "BitChord" (com.music.bitchord)
#
# Each run also builds the Wear OS app of the same channel and publishes it under
# app=bitchord-wear: a watch only pairs with a phone app of the same package
# signed with the same key, so it has to come from here too. And the Android TV
# app, published under app=bitchord-tv, which its update check follows.
#
# Both are release builds (R8-shrunk, which is also what keeps the APK under the
# 100MB upload limit the API sits behind), signed with the family key from the
# KEYSTORE_* secrets so every build installs over the one before it.
name: Publish build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [dev, prod]
        default: dev
      notes:
        description: "Release notes shown on the download page"
        required: false
        default: "Test build"
      notify:
        description: "Ping the household Discord"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the secrets are there
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_TOKEN: ${{ secrets.XPS_RELEASE_TOKEN }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "$RELEASE_TOKEN" ] || missing="$missing XPS_RELEASE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Signing key and local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          echo "storeFile=bitchord-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Version
        id: version
        run: |
          # The app's version lives in the root build file since upstream 1.8.1
          # (extra["bitchordVersionName"] = "1.8.1"). An empty one must fail the
          # build: published as "-20261027-...", the update check can't order it.
          base=$(sed -n 's/^extra\["bitchordVersionName"\] = "\([0-9][0-9.]*\)"$/\1/p' build.gradle.kts | head -n 1)
          [ -n "$base" ] || { echo "Couldn't read the app version from build.gradle.kts"; exit 1; }
          echo "value=${base}-$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          task=$([ "${{ inputs.channel }}" = prod ] && echo assembleProdRelease || echo assembleDevRelease)
          ./gradlew ":app:$task" ":wearos:$task" ":tv:$task" "-Pbitchord.version=${{ steps.version.outputs.value }}" --console=plain

      - name: Verify the APK is signed and fits the upload limit
        id: apk
        run: |
          flavor=${{ inputs.channel }}
          APK="app/build/outputs/apk/${flavor}/release/app-${flavor}-arm64-v8a-release.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify "$APK"
          SIZE_MB=$(( $(stat -c%s "$APK") / 1048576 ))
          echo "APK is ${SIZE_MB}MB (limit 100MB)"
          if [ "$SIZE_MB" -ge 100 ]; then
            echo "::error::APK is ${SIZE_MB}MB, at or over the 100MB upload limit."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          WEAR="wearos/build/outputs/apk/${flavor}/release/BitChordWear-${flavor}-release.apk"
          "$BUILD_TOOLS/apksigner" verify "$WEAR"
          echo "wear=$WEAR" >> "$GITHUB_OUTPUT"
          TV=$(ls tv/build/outputs/apk/${flavor}/release/*universal*.apk | head -n 1)
          "$BUILD_TOOLS/apksigner" verify "$TV"
          TV_MB=$(( $(stat -c%s "$TV") / 1048576 ))
          echo "TV APK is ${TV_MB}MB"
          [ "$TV_MB" -lt 100 ] || { echo "::error::TV APK is ${TV_MB}MB, over the 100MB upload limit."; exit 1; }
          echo "tv=$TV" >> "$GITHUB_OUTPUT"

      - name: Publish to the releases page
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          curl --fail-with-body \
            -F "apk=@${{ steps.apk.outputs.path }}" \
            -F "version=${{ steps.version.outputs.value }}" \
            -F "notes=${NOTES}" \
            -F "notify=${{ inputs.notify }}" \
            -H "Authorization: Bearer ${{ secrets.XPS_RELEASE_TOKEN }}" \
            "https://api.tinotenda.co/api/v1/releases/bitchord/${{ inputs.channel }}/publish"

      - name: Publish the watch app
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          curl --fail-with-body             -F "apk=@${{ steps.apk.outputs.wear }}"             -F "version=${{ steps.version.outputs.value }}"             -F "notes=${NOTES}"             -F "notify=false"             -H "Authorization: Bearer ${{ secrets.XPS_RELEASE_TOKEN }}"             "https://api.tinotenda.co/api/v1/releases/bitchord-wear/${{ inputs.channel }}/publish"

      - name: Publish the TV app
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          curl --fail-with-body             -F "apk=@${{ steps.apk.outputs.tv }}"             -F "version=${{ steps.version.outputs.value }}"             -F "notes=${NOTES}"             -F "notify=false"             -H "Authorization: Bearer ${{ secrets.XPS_RELEASE_TOKEN }}"             "https://api.tinotenda.co/api/v1/releases/bitchord-tv/${{ inputs.channel }}/publish"
